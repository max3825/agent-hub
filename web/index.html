<!doctype html>
<html lang="fr" data-type="skill">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Hub — skills, hooks et mods pour agents IA de code</title>
    <meta name="description" content="Le méta-annuaire des extensions pour agents IA de code : skills, hooks et mods agrégés depuis GitHub, skills.sh et les marketplaces. Recherche instantanée." />
    <meta name="theme-color" content="#0c0c0d" />
    <link rel="preload" href="/src/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Lien partagé /i/<id>/ servi par le fallback SPA (serveur de dev, hébergeur sans 404.html) → ouvre la fiche.
      (function () {
        var m = location.pathname.match(/\/i\/([0-9a-f]{16})\/?$/);
        if (m) location.replace(location.pathname.slice(0, m.index + 1) + "?item=" + m[1]);
      })();
    </script>
    <script>
      // Appliquer le thème avant le premier rendu (évite le flash).
      (function () {
        try {
          var t = localStorage.getItem("ah-theme");
          if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
        } catch (e) { document.documentElement.dataset.theme = "dark"; }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Shell statique : peint dès que le CSS est chargé (sans attendre le JS) ; React le remplace au montage.
           Mêmes dimensions que le vrai header + hero pour éviter tout décalage. -->
      <div class="min-h-dvh">
        <div class="h-16 border-b border-line"></div>
        <section class="relative overflow-hidden border-b border-line">
          <div class="relative mx-auto max-w-7xl px-4 py-10 sm:py-14">
            <h1 data-en="Everything that extends your coding agents, <span class=&quot;text-muted&quot;>in one place.</span>" class="max-w-2xl text-balance text-3xl font-semibold tracking-tight sm:text-5xl">Tout ce qui étend vos agents de code, <span class="text-muted">au même endroit.</span></h1>
            <p data-en="A meta-directory of skills, hooks and mods for Claude Code, Codex, Cursor and friends — aggregated from GitHub, skills.sh and marketplaces, updated every 12 hours." class="mt-4 max-w-xl text-pretty text-[15px] text-muted">Un méta-annuaire des skills, hooks et mods pour Claude Code, Codex, Cursor et consorts — agrégés depuis GitHub, skills.sh et les marketplaces, mis à jour toutes les 12 heures.</p>
            <div class="mt-7 h-10"></div>
          </div>
        </section>
      </div>
    </div>
    <script>
      // Squelette statique en anglais si la langue (choisie ou du navigateur) est l'anglais : pas de flash français.
      (function () {
        var l; try { l = localStorage.getItem("ah-lang"); } catch (e) {}
        if (l !== "fr" && l !== "en") l = (navigator.language || "").toLowerCase().indexOf("fr") === 0 ? "fr" : "en";
        document.documentElement.lang = l;
        if (l === "en") document.querySelectorAll("[data-en]").forEach(function (el) { el.innerHTML = el.getAttribute("data-en"); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
