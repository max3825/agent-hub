# ─────────────────────────────────────────────────────────────────────────────
# Agent Hub — mise à jour automatique + déploiement GitHub Pages
#
#   1. crawle les sources (budget de temps : le site ne rétrécit jamais, voir CRAWL_MAX_MINUTES) (crawler/sources.yaml) → data/items.json + index de recherche
#   2. construit le site Vite avec les VRAIES données
#   3. déploie sur GitHub Pages
#
# Déclencheurs : toutes les 12 h, à la main (Actions → Run workflow), et à chaque push sur main.
#
# Réglages requis (une seule fois) :
#   - Settings → Pages → Source : « GitHub Actions »
#   - Secret OPTIONNEL `ANTHROPIC_API_KEY` : active les résumés FR/EN via Claude Haiku.
#     Sans lui, le pipeline fonctionne quand même (résumés de repli : frontmatter / README).
#   - Secret OPTIONNEL `CRAWLER_GITHUB_TOKEN` : PAT en lecture publique, quota plus confortable
#     que le GITHUB_TOKEN automatique (qui suffit toutefois pour un crawl modéré).
# ─────────────────────────────────────────────────────────────────────────────
name: Update and deploy

on:
  schedule:
    - cron: "0 */12 * * *"          # toutes les 12 heures (UTC)
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Budget de temps du crawl en minutes (vide = 42 ; 10 pour un push). Passé ce délai, les dépôts restants reprennent leur dernière analyse (cache) : le site ne rétrécit pas."
        required: false
        default: ""
      no_summaries:
        description: "Ne pas appeler l'API Anthropic (repli uniquement)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; un run en cours n'est pas annulé en plein déploiement.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Garde-fou : on ne publie pas si les tests du crawler échouent.
      - name: Tests du crawler
        run: pytest

      # Le cache `.cache/` (ETag, métadonnées de dépôts, résumés, firstSeen) rend les runs incrémentaux.
      # Clé unique par run + restore-keys : on repart toujours du dernier cache connu, puis on le ré-enregistre.
      - name: Restaurer le cache du crawler
        uses: actions/cache@v4
        with:
          path: .cache
          key: crawler-cache-${{ github.run_id }}
          restore-keys: crawler-cache-

      - name: Crawl
        env:
          GITHUB_TOKEN: ${{ secrets.CRAWLER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optionnel (vide → résumés de repli)
          MAX_SUMMARIES_PER_RUN: "300"                           # garde-fou de budget
          # Budget de temps : au-delà, le crawl s'arrête proprement et les dépôts restants reprennent leur
          # dernière analyse (cache) → le site ne rétrécit jamais et le prochain run continue où celui-ci s'est arrêté.
          CRAWL_MAX_MINUTES: ${{ inputs.max_minutes || (github.event_name == 'push' && '10' || '42') }}
        run: |
          ARGS=""
          if [ "${{ inputs.no_summaries }}" = "true" ]; then ARGS="$ARGS --no-summaries"; fi
          python -m crawler $ARGS

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build du site (données réelles)
        working-directory: web
        env:
          DATA_SOURCE: real
        run: |
          # URL publique (liens canoniques, sitemap.xml, aperçus Open Graph des pages /i/<id>/), construite depuis
          # des variables toujours présentes — y compris sur les runs `schedule`, dont le payload n'a pas de `repository`.
          export SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      # Garde une copie brute des données pour inspection / debug.
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: |
            data/items.json
            data/meta.json
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
