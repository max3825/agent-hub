<!doctype html>
<html lang="fr" data-type="skill">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Hub — skills, hooks et mods pour agents IA de code</title>
    <meta name="description" content="Le méta-annuaire des extensions pour agents IA de code : skills, hooks et mods agrégés depuis GitHub, skills.sh et les marketplaces. Recherche instantanée." />
    <meta name="theme-color" content="#0c0c0d" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Appliquer le thème avant le premier rendu (évite le flash).
      (function () {
        try {
          var t = localStorage.getItem("ah-theme");
          if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
        } catch (e) { document.documentElement.dataset.theme = "dark"; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
